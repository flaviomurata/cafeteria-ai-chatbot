# @format

services:
  ingest-partner-knowledge:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      - INDEX_VOLUME_READ_ONLY=false
    command:
      - /app/.venv/bin/python
      - -m
      - src.partner_knowledge.ingestion
    volumes:
      - ./apps/api/media/cafeteria-documents:/app/media/cafeteria-documents:ro
      - partner-knowledge-index:/app/data/partner-knowledge-index
      - partner-knowledge-runtime:/app/data/partner-knowledge-runtime

  agent-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '127.0.0.1:8000:8000'
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - INDEX_VOLUME_READ_ONLY=true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - partner-knowledge-index:/app/data/partner-knowledge-index:ro
      - partner-knowledge-runtime:/app/data/partner-knowledge-runtime
    restart: unless-stopped
    stop_grace_period: 15s

  web:
    build: ./apps/web
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      agent-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  partner-knowledge-index:
  partner-knowledge-runtime:
